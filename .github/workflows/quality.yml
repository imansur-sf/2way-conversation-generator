name: Studio quality gate

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ''
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        id: dependencies
      - run: npx playwright install --with-deps chromium
        id: browser
      - name: Code-level regression tests
        run: npm test
      - name: Browser security
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node test/security-browser.mjs
      - name: Browser state reliability
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node test/state-browser.mjs
      - name: Downloaded export integrity
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node test/export-browser.mjs
      - name: Integrated builder and playback
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node test/e2e-local.mjs
